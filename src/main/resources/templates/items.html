<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Todo List - Danh sách công việc</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <style>
        body { background-color: #f8f9fa; padding: 30px; font-family: "Segoe UI", Roboto, sans-serif; }
        h1 { text-align: center; color: #0d6efd; font-weight: 600; margin-bottom: 30px; }
        .card { border-radius: 12px; overflow: hidden; }
        thead { background-color: #0d6efd; color: #fff; }
        tbody tr:hover { background-color: #f1f3f5; }
        .btn-primary-custom { background-color: #0d6efd; border: none; box-shadow: 0 4px 10px rgba(13,110,253,0.2); }
        .btn-primary-custom:hover { background-color: #0b5ed7; }
        .priority-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; margin-right: 6px; }
        .priority-low { background: #4CD964; }
        .priority-mid { background: #FFCC00; }
        .priority-high { background: #FF6B3A; }
    </style>
</head>

<body>
<div class="container">
    <h1>Danh sách công việc</h1>

    <div class="d-flex justify-content-between mb-3">
        <a th:href="@{/items/new}" class="btn btn-primary btn-primary-custom">
            <i class="fa fa-plus me-1"></i> Thêm công việc
        </a>

        <form th:action="@{/items/filterByDate}" method="post" class="d-flex gap-2">
            <input type="date" id="filterDate" name="date" class="form-control" style="width: 180px;" placeholder="Chọn ngày" th:value="${selectedDate}">
            <button type="submit" class="btn btn-outline-primary">
                <i class="fa fa-search me-1"></i> Tìm kiếm
            </button>
            <a th:href="@{/items/showview}" class="btn btn-outline-secondary">
                <i class="fa fa-times me-1"></i> Đặt lại
            </a>
        </form>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-hover align-middle text-center">
                <thead>
                <tr>
                    <th>STT</th>
                    <th>Ưu tiên</th>
                    <th>Tiêu đề</th>
                    <th>Bắt đầu</th>
                    <th>Kết thúc</th>
                    <th>Lặp lại</th> <th>Trạng thái</th>
                    <th>Danh mục</th>
                    <th>Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item, iterStat : ${items}">

                    <td th:text="${iterStat.count}"></td>

                    <td>
                        <span th:class="'priority-dot ' +
                            (${item.prioritize} >= 3 ? 'priority-high' :
                            (${item.prioritize} == 2 ? 'priority-mid' : 'priority-low'))">
                        </span>
                        <span th:text="${item.prioritize}"></span>
                    </td>
                    <td th:text="${item.title}"></td>
                    <td th:text="${#temporals.format(item.start, 'dd/MM/yyyy HH:mm')}"></td>
                    <td th:text="${#temporals.format(item.due, 'dd/MM/yyyy HH:mm')}"></td>

                    <td>
                        <span th:if="${item.recurrenceInterval == 'WEEK'}" class="badge bg-info text-dark">Tuần</span>
                        <span th:if="${item.recurrenceInterval == 'MONTH'}" class="badge bg-info text-dark">Tháng</span>
                        <span th:if="${item.recurrenceInterval == 'YEAR'}" class="badge bg-info text-dark">Năm</span>
                        <span th:if="${item.recurrenceInterval == null or item.recurrenceInterval == ''}" class="text-muted">--</span>
                    </td>

                    <td>
                        <form th:action="@{'/items/toggle-status/' + ${item.id}}" method="post" style="display: inline;">
                            <button type="submit"
                                    class="badge border-0"
                                    style="cursor: pointer; font-size: 0.9rem;"
                                    th:classappend="${item.status} ? 'bg-success' : 'bg-warning text-dark'"
                                    title="Nhấn để đổi trạng thái">
                                <span th:text="${item.status} ? 'Hoàn thành' : 'Đang làm'"></span>
                                <i class="fa fa-sync-alt ms-1" style="font-size: 0.8em; opacity: 0.7;"></i>
                            </button>
                        </form>
                    </td>
                    <td>
                        <span th:if="${item.name != null}" th:text="${item.name}"></span>
                        <span th:unless="${item.name != null}">--</span>
                    </td>
                    <td>
                        <a th:href="@{'/items/edit/' + ${item.id}}" class="btn btn-sm btn-outline-primary" title="Sửa">
                            <i class="fa fa-pen"></i>
                        </a>
                        <form th:action="@{'/items/delete/' + ${item.id}}" method="post" style="display:inline;">
                            <input type="hidden" name="_method" value="delete"/>
                            <button type="submit" class="btn btn-sm btn-outline-danger"
                                    onclick="return confirm('Bạn có chắc muốn xóa công việc này?');">
                                <i class="fa fa-trash"></i>
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
